linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - bodyclose
    - errorlint
    - gofmt
    - gosimple
    - ineffassign
    - unused
    - gocritic
    - noctx

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-return
      - name: error-strings
      - name: blank-imports
  errorlint:
    errorf: true
    asserts: true
    comparison: true

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
