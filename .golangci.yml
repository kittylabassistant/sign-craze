version: "2"

formatters:
  enable:
    - gofmt

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - bodyclose
    - errorlint
    - ineffassign
    - unused
    - gocritic
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: blank-imports
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - noctx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
