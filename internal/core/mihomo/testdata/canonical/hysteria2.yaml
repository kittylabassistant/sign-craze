log-level: info
mode: rule

tproxy-port: 7895
routing-mark: 83

dns:
  enable: true
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 114.114.114.114
  nameserver:
    - https://dns.google/dns-query

proxies:
- {name: hy2-out, type: hysteria2, server: hy2.example.com, port: 443, down: 300, password: hy2-password-placeholder, skip-cert-verify: false, sni: hy2.example.com, up: 100}

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - hy2-out
      - DIRECT

rules:
  - MATCH,PROXY

external-controller: 127.0.0.1:9094
secret: ''
