log-level: info
mode: rule

tproxy-port: 7895
routing-mark: 83

dns:
  enable: true
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 114.114.114.114
  nameserver:
    - https://dns.google/dns-query

proxies:
- {name: tuic-out, type: tuic, server: tuic.example.com, port: 443, congestion-controller: bbr, password: tuic-password-placeholder, servername: tuic.example.com, tls: true, udp-relay-mode: native, uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee}

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - tuic-out
      - DIRECT

rules:
  - MATCH,PROXY

external-controller: 127.0.0.1:9094
secret: ''
