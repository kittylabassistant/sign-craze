log-level: info
mode: rule

tproxy-port: 7895
routing-mark: 83

dns:
  enable: true
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 114.114.114.114
  nameserver:
    - https://dns.google/dns-query

proxies:
- {name: ss-out, type: ss, server: ss.example.com, port: 8388, cipher: chacha20-ietf-poly1305, password: s3cr3t-password-placeholder}

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - ss-out
      - DIRECT

rules:
  - MATCH,PROXY

external-controller: 127.0.0.1:9094
secret: ''
