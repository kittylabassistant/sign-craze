name: Wiki sync

on:
  push:
    branches: ["main"]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone wiki repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            wiki-repo

      - name: Mirror wiki/ into wiki repo
        run: rsync -a --delete --exclude='.git' wiki/ wiki-repo/

      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "wiki: sync from main@${GITHUB_SHA::7}"
          # push в ту же ветку, что отдал clone wiki-репо (сейчас master);
          # HEAD вместо хардкода — не сломается, если GitHub переинициализирует wiki на main
          git push origin HEAD
