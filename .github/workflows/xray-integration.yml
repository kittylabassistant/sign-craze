name: xray check golden

on: [push, pull_request]

jobs:
  xray-check:
    uses: ./.github/workflows/core-golden.yml
    with:
      core-name: xray
      core-version: "25.12.8"
      install: |
        XRAY_VERSION=25.12.8
        wget -qO /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip
        unzip -d /tmp/xray /tmp/xray.zip
        sudo install /tmp/xray/xray /usr/local/bin/
        xray version
      test-path: ./internal/core/xray/...
      build-tag: xraycheck
      golden-run: TestXrayCheck_Golden
