name: xray check golden

on: [push, pull_request]

jobs:
  xray-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Установка xray
        run: |
          XRAY_VERSION=25.12.8
          wget -qO /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip
          unzip -d /tmp/xray /tmp/xray.zip
          sudo install /tmp/xray/xray /usr/local/bin/
          xray version

      - name: go vet
        run: go vet ./...

      - name: Тесты без тега (основные)
        run: go test ./internal/core/xray/...

      - name: xray check golden конфиги
        run: go test -tags xraycheck ./internal/core/xray/... -run TestXrayCheck_Golden -v
