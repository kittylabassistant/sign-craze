name: Publish opkg feed

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-feed:
    # Для workflow_run: запускать только при успешном завершении Release.
    # Для workflow_dispatch: всегда запускать.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout основной ветки для доступа к scripts/ и packaging/ ──────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      # ── 1a. Сохранение scripts/ и packaging/ перед переключением веток ──────
      - name: Stash main branch tools
        run: |
          mkdir -p /tmp/main-tools
          cp -r main-repo/scripts /tmp/main-tools/
          cp -r main-repo/packaging /tmp/main-tools/
          ls -la /tmp/main-tools/scripts/ /tmp/main-tools/packaging/opkg/

      # ── 2. Checkout или создание ветки gh-pages ──────────────────────────────
      - name: Setup gh-pages branch
        run: |
          cd main-repo
          # Проверяем, существует ли remote gh-pages
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            echo "Ветка gh-pages не существует, создаём orphan..."
            git checkout --orphan gh-pages
            git rm -rf .
            # Создаём минимальный индекс, чтобы ветка имела хотя бы один коммит
            touch .gitkeep
            git add .gitkeep
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: инициализация gh-pages"
            git push origin gh-pages
            # Возвращаемся к main чтобы снова сделать чистый checkout
            git checkout main
            git fetch origin gh-pages
            git checkout gh-pages
          fi

      # ── 3. Определение версии последнего релиза ──────────────────────────────
      - name: Get latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Последний release: ${TAG}"

      # ── 4. Скачивание .ipk файлов из Release ─────────────────────────────────
      - name: Download .ipk assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p main-repo/_release_assets
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.ipk" \
            --dir main-repo/_release_assets/ \
            --clobber
          echo "Скачанные .ipk:"
          ls -lh main-repo/_release_assets/*.ipk 2>/dev/null || echo "  (нет .ipk файлов)"

      # ── 5. Сборка usign из source (glibc Ubuntu + OpenWRT usign) ─────────────
      - name: Install build dependencies for usign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev pkg-config git ca-certificates

      - name: Build usign from source
        run: |
          git clone --depth=1 https://git.openwrt.org/project/usign.git /tmp/usign-src
          cmake -S /tmp/usign-src -B /tmp/usign-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/usign-build --parallel
          sudo cp /tmp/usign-build/usign /usr/local/bin/usign
          usign --version 2>/dev/null || usign 2>&1 | head -2 || true
          echo "usign установлен: $(which usign)"

      # ── 6. Восстановление приватного ключа из Secret ─────────────────────────
      - name: Setup usign signing key
        env:
          USIGN_PRIVATE_KEY: ${{ secrets.USIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$USIGN_PRIVATE_KEY" ]; then
            echo "USIGN_PRIVATE_KEY не задан — feed будет опубликован без подписи"
            echo "USIGN_KEY=" >> "$GITHUB_ENV"
          else
            mkdir -p /tmp/usign-key
            printf '%s' "$USIGN_PRIVATE_KEY" | base64 -d > /tmp/usign-key/key.sec
            chmod 600 /tmp/usign-key/key.sec
            echo "USIGN_KEY=/tmp/usign-key/key.sec" >> "$GITHUB_ENV"
            echo "Приватный ключ восстановлен"
          fi

      # ── 7. Генерация feed (Packages + Packages.gz + Packages.sig) ────────────
      - name: Generate opkg feed
        run: |
          cd main-repo
          # Скрипт хранится в main, но main-repo сейчас на gh-pages.
          # Используем stash из /tmp/main-tools/ (см. шаг 1a).
          bash /tmp/main-tools/scripts/build-opkg-feed.sh _release_assets/ entware/

      # ── 8. Копирование публичного ключа в корень feed ─────────────────────────
      - name: Copy public key to feed root
        run: |
          cd main-repo
          if [ -f /tmp/main-tools/packaging/opkg/sign-craze-feed.pub ]; then
            cp /tmp/main-tools/packaging/opkg/sign-craze-feed.pub entware/sign-craze-feed.pub
            echo "Публичный ключ скопирован в entware/sign-craze-feed.pub"
          else
            echo "Предупреждение: публичный ключ не найден в stash" >&2
          fi

      # ── 9. Commit и push в gh-pages ──────────────────────────────────────────
      - name: Commit and push feed to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd main-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entware/
          # Если нет изменений — не падаем, просто сообщаем
          if git diff --cached --quiet; then
            echo "Нет изменений в feed, push пропущен"
          else
            git commit -m "opkg feed: ${{ steps.release.outputs.tag }}"
            git push origin gh-pages
            echo "Feed опубликован для версии ${{ steps.release.outputs.tag }}"
          fi
