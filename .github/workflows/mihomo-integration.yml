name: mihomo check golden

on: [push, pull_request]

jobs:
  mihomo-check:
    uses: ./.github/workflows/core-golden.yml
    with:
      core-name: mihomo
      core-version: "1.19.24"
      install: |
        MIHOMO_VERSION=1.19.24
        wget -qO /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
        gunzip /tmp/mihomo.gz
        sudo install /tmp/mihomo /usr/local/bin/mihomo
        mihomo -v
      test-path: ./internal/core/mihomo/...
      build-tag: mihomocheck
      golden-run: TestMihomoCheck_Golden
