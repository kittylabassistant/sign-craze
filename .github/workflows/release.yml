name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            goarm: ""
            gomips: ""
            suffix: arm64
          - goarch: arm
            goarm: "7"
            gomips: ""
            suffix: arm7
          - goarch: mipsle
            goarm: ""
            gomips: softfloat
            suffix: mipsle
          - goarch: mips
            goarm: ""
            gomips: softfloat
            suffix: mips

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist
          go build -buildvcs=false \
            -ldflags="-s -w -X github.com/kittylabassistant/sign-craze/internal/version.Version=${{ github.ref_name }}" \
            -trimpath \
            -o dist/sign-craze-${{ matrix.suffix }} \
            ./cmd/sign-craze

      - name: install upx
        run: sudo apt-get install -y upx

      - name: compress
        # UPX не поддерживает mips big-endian — пропускать без ошибки
        run: upx --lzma dist/sign-craze-${{ matrix.suffix }} || true

      - name: checksum
        run: |
          cd dist
          sha256sum sign-craze-${{ matrix.suffix }} > sign-craze-${{ matrix.suffix }}.sha256

      - name: bundle tar.gz (offline install)
        run: |
          cd dist
          BUNDLE="signcraze-${{ matrix.suffix }}-bundle"
          mkdir -p "$BUNDLE"
          cp "sign-craze-${{ matrix.suffix }}" "$BUNDLE/sign-craze"
          (cd "$BUNDLE" && sha256sum sign-craze > sign-craze.sha256)
          cp ../scripts/install.sh "$BUNDLE/install.sh"
          cat > "$BUNDLE/install-offline.sh" <<'EOF'
          #!/bin/sh
          set -eu
          DIR=$(cd "$(dirname "$0")" && pwd)
          exec env SIGNCRAZE_BIN="$DIR/sign-craze" \
                   SIGNCRAZE_SHA256="$DIR/sign-craze.sha256" \
                   SIGNCRAZE_VERSION="__VERSION__" \
                   sh "$DIR/install.sh"
          EOF
          sed -i "s|__VERSION__|${{ github.ref_name }}-${{ matrix.suffix }}|" "$BUNDLE/install-offline.sh"
          chmod +x "$BUNDLE/install-offline.sh"
          tar czf "signcraze-${{ matrix.suffix }}.tar.gz" "$BUNDLE"
          rm -rf "$BUNDLE"

      - uses: actions/upload-artifact@v7
        with:
          name: sign-craze-${{ matrix.suffix }}
          path: dist/

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: stage install.sh
        run: cp scripts/install.sh dist/install.sh

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
