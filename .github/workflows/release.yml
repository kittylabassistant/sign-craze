name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            goarm: ""
            gomips: ""
            suffix: arm64
            upx: "true"
          - goarch: arm
            goarm: "7"
            gomips: ""
            suffix: arm7
            upx: "true"
          # mipsle: UPX-стаб сегфолтит на Keenetic 4.9 mipsle при interactive
          # запуске CLI (term.IsTerminal=true путь крашит). Бинарь идёт несжатым.
          - goarch: mipsle
            goarm: ""
            gomips: softfloat
            suffix: mipsle
            upx: "false"
          # mips big-endian: UPX вообще не поддерживает.
          - goarch: mips
            goarm: ""
            gomips: softfloat
            suffix: mips
            upx: "false"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          # Чистим dist полностью: в main закоммичены stale бинари (abcf418),
          # без очистки они просочатся в artifact и через merge-multiple
          # перезапишут правильные сжатые бинари других матриц.
          rm -rf dist
          mkdir -p dist
          go build -buildvcs=false \
            -ldflags="-s -w -buildid= -X github.com/kittylabassistant/sign-craze/internal/version.Version=${{ github.ref_name }}" \
            -trimpath \
            -o dist/sign-craze-${{ matrix.suffix }} \
            ./cmd/sign-craze

      - name: install upx
        if: matrix.upx == 'true'
        run: sudo apt-get install -y upx

      - name: compress
        if: matrix.upx == 'true'
        run: upx --lzma dist/sign-craze-${{ matrix.suffix }}

      - name: checksum
        run: |
          cd dist
          sha256sum sign-craze-${{ matrix.suffix }} > sign-craze-${{ matrix.suffix }}.sha256

      - name: bundle tar.gz (offline install)
        run: |
          cd dist
          BUNDLE="signcraze-${{ matrix.suffix }}-bundle"
          mkdir -p "$BUNDLE"
          cp "sign-craze-${{ matrix.suffix }}" "$BUNDLE/sign-craze"
          (cd "$BUNDLE" && sha256sum sign-craze > sign-craze.sha256)
          cp ../scripts/install.sh "$BUNDLE/install.sh"
          cat > "$BUNDLE/install-offline.sh" <<'EOF'
          #!/bin/sh
          set -eu
          DIR=$(cd "$(dirname "$0")" && pwd)
          exec env SIGNCRAZE_BIN="$DIR/sign-craze" \
                   SIGNCRAZE_SHA256="$DIR/sign-craze.sha256" \
                   SIGNCRAZE_VERSION="__VERSION__" \
                   sh "$DIR/install.sh"
          EOF
          sed -i "s|__VERSION__|${{ github.ref_name }}-${{ matrix.suffix }}|" "$BUNDLE/install-offline.sh"
          chmod +x "$BUNDLE/install-offline.sh"
          tar czf "signcraze-${{ matrix.suffix }}.tar.gz" "$BUNDLE"
          rm -rf "$BUNDLE"

      - name: build IPK
        run: |
          sh scripts/build-ipk.sh ${{ matrix.suffix }} ${{ github.ref_name }}

      - name: IPK arch suffix
        id: ipk_arch
        run: |
          case "${{ matrix.suffix }}" in
            arm64)  echo "arch=aarch64-3.10" >> "$GITHUB_OUTPUT" ;;
            arm7)   echo "arch=armv7-3.2"   >> "$GITHUB_OUTPUT" ;;
            mipsle) echo "arch=mipsel-3.4"  >> "$GITHUB_OUTPUT" ;;
            mips)   echo "arch=mips-3.4"    >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: sign-craze-${{ matrix.suffix }}
          # Явный список — защита от случайного включения чужих файлов.
          path: |
            dist/sign-craze-${{ matrix.suffix }}
            dist/sign-craze-${{ matrix.suffix }}.sha256
            dist/signcraze-${{ matrix.suffix }}.tar.gz
            dist/sign-craze_*_${{ steps.ipk_arch.outputs.arch }}.ipk
            dist/sign-craze_*_${{ steps.ipk_arch.outputs.arch }}.ipk.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write    # OIDC для cosign keyless signing
      attestations: write
    env:
      # Глушим внутренние Node.js DeprecationWarning'и (DEP0005 Buffer() и
      # подобные) которые приходят из кода сторонних actions — не наш код.
      NODE_OPTIONS: --no-deprecation
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: stage install.sh
        run: cp scripts/install.sh dist/install.sh

      - name: sha256sums.txt (aggregate)
        run: cd dist && sha256sum sign-craze-* sign-craze_*.ipk > sha256sums.txt

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign release artifacts (keyless OIDC)
        run: |
          for f in dist/sign-craze-* dist/sign-craze_*.ipk; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sig|*.pem|*.sha256) continue ;;
            esac
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/sign-craze-*
            dist/sign-craze_*.ipk

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/sign-craze-*
            dist/sign-craze_*.ipk
            dist/sign-craze_*.ipk.sha256
            dist/signcraze-*.tar.gz
            dist/sha256sums.txt
            dist/install.sh
          generate_release_notes: true
