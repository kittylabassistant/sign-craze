name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -timeout 5m ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      # Глушим внутренние Node.js DeprecationWarning'и (DEP0040 punycode,
      # DEP0169 url.parse) из кода golangci-lint-action — не наш код.
      NODE_OPTIONS: --no-deprecation
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    name: cross-compile (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            goarm: ""
            gomips: ""
            suffix: arm64
          - goarch: arm
            goarm: "7"
            gomips: ""
            suffix: arm7
          - goarch: mipsle
            goarm: ""
            gomips: softfloat
            suffix: mipsle
          - goarch: mips
            goarm: ""
            gomips: softfloat
            suffix: mips
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist
          go build -buildvcs=false \
            -ldflags="-s -w" \
            -trimpath \
            -o dist/sign-craze-${{ matrix.suffix }} \
            ./cmd/sign-craze

  firewall-integration:
    name: Firewall integration tests (privileged)
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build test image
        run: docker build -t signcraze-ipt -f testdata/docker/Dockerfile.iptables .

      - name: Run firewall integration tests
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/work -w /work \
            signcraze-ipt \
            go test -tags=integration -v -timeout 5m ./internal/firewall/...
