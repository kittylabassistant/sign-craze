name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -timeout 5m ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  build:
    name: cross-compile (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            goarm: ""
            gomips: ""
            suffix: arm64
          - goarch: arm
            goarm: "7"
            gomips: ""
            suffix: arm7
          - goarch: mipsle
            goarm: ""
            gomips: softfloat
            suffix: mipsle
          - goarch: mips
            goarm: ""
            gomips: softfloat
            suffix: mips
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p dist
          go build -buildvcs=false \
            -ldflags="-s -w" \
            -trimpath \
            -o dist/sign-craze-${{ matrix.suffix }} \
            ./cmd/sign-craze
