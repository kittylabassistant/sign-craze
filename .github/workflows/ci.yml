name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: test (race)
        run: go test -race -timeout 5m ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: build all targets
        run: make all
