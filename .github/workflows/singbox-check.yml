name: sing-box check golden

on: [push, pull_request]

jobs:
  singbox-check:
    uses: ./.github/workflows/core-golden.yml
    with:
      core-name: sing-box
      core-version: "1.13.11"
      install: |
        SINGBOX_VERSION=1.13.11
        wget -qO- https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz \
          | tar xz -C /tmp
        sudo install /tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box /usr/local/bin/
        sing-box version
      test-path: ./internal/singbox/...
      build-tag: singboxcheck
      golden-run: TestSingBoxCheck_Golden
