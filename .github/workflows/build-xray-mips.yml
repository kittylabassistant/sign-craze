name: Build xray for MIPS (Keenetic)

# Собирает xray из XTLS/Xray-core с принудительным toolchain Go 1.24 +
# GOMIPS=softfloat. Цель — обойти регрессию Go 1.25 runtime в futex/MIPS,
# из-за которой официальные XTLS-бинари (Go 1.25+) сегфолтятся на ядрах
# Keenetic (3.4–4.x; ENOSYS на futex syscall). Go 1.24 проверен через
# совместимый sing-box v1.13.11 (Go 1.24.7), который работает на этих
# роутерах без падений.
#
# Pinned xray ref — v25.12.8: последний stable до того как gvisor у xray
# был обновлён до версии с Go 1.25.5-min требованием. v25.12.8 содержит
# PQ-VLESS, Vision UDP443, XHTTP modes — всё, что нужно проекту.
#
# Запуск ручной (workflow_dispatch). После успешной публикации релиза
# `xray-mips-<xray_ref>` константа internal/core/xray.XRayMIPSVersion
# обновляется вручную в исходниках под новую версию.

on:
  workflow_dispatch:
    inputs:
      xray_ref:
        description: 'XTLS/Xray-core git tag (e.g. v25.12.8 — last before gvisor go-1.25 bump)'
        required: true
        default: 'v25.12.8'
      go_version:
        description: 'Go toolchain version (1.24.x — verified working on Keenetic via sing-box v1.13.11)'
        required: true
        default: '1.24.7'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: mipsle
            gomips: softfloat
            suffix: mips32le
            zip_name: Xray-linux-mips32le.zip
          - goarch: mips
            gomips: softfloat
            suffix: mips32
            zip_name: Xray-linux-mips32.zip

    steps:
      - name: checkout xray-core
        uses: actions/checkout@v6
        with:
          repository: XTLS/Xray-core
          ref: ${{ inputs.xray_ref }}
          path: xray-core

      - name: pin go.mod toolchain to 1.24 (MIPS kernel compat)
        working-directory: xray-core
        # xray v25.12.8 объявляет `go 1.25` в go.mod. Без правки toolchain
        # автоматически подтянет 1.25 и попадём на регрессию futex/MIPS.
        # Сбрасываем директиву на 1.24 + убираем `toolchain` строку, чтобы
        # GOTOOLCHAIN=local гарантировал использование локально установленного
        # Go ${{ inputs.go_version }}. gvisor в этом теге требует go 1.23.1
        # min — c 1.24 проходит.
        run: |
          sed -i -E 's/^go [0-9]+\.[0-9]+(\.[0-9]+)?$/go 1.24/' go.mod
          sed -i '/^toolchain /d' go.mod
          echo '--- patched go.mod ---'
          head -5 go.mod

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: xray-core/go.sum

      - name: go mod tidy (resync after toolchain downgrade)
        working-directory: xray-core
        env:
          GOTOOLCHAIN: local
        # После sed-патча go-директивы Go видит несогласованность go.mod/go.sum
        # (некоторые тестовые/transitive deps требуют resolve под целевой
        # toolchain). `go mod tidy` приводит manifest в самосогласованный вид
        # БЕЗ апгрейда основных deps — gvisor/quic-go/utls остаются на тех же
        # версиях, что и в pinned xray ref.
        run: go mod tidy

      - name: build
        working-directory: xray-core
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOTOOLCHAIN: local
        run: |
          mkdir -p ../dist
          go build -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -trimpath \
            -o ../dist/xray \
            ./main

      - name: pack zip (mirror upstream layout)
        run: |
          cd dist
          zip -9 ${{ matrix.zip_name }} xray
          rm xray
          ls -la

      - name: checksum
        run: |
          cd dist
          sha256sum ${{ matrix.zip_name }} > ${{ matrix.zip_name }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: xray-${{ matrix.suffix }}
          path: dist/

  publish:
    name: publish xray-mips release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: list assets
        run: ls -la dist/

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xray-mips-${{ inputs.xray_ref }}
          name: 'Xray ${{ inputs.xray_ref }} for Keenetic MIPS (Go ${{ inputs.go_version }})'
          body: |
            Pre-built xray binaries for Keenetic OpenWRT/Entware (MIPS, kernel 3.4–4.x).

            **Why:** official XTLS releases (v26.x) are built with Go 1.25+,
            whose runtime uses futex operations not available in old MIPS kernels
            (`futexwakeup ... returned -89` ENOSYS → SIGSEGV at startup).
            Verified via sing-box v1.13.11 (Go 1.24.7) which runs cleanly on
            same hardware.

            **Pinned xray:** ${{ inputs.xray_ref }} — last stable before gvisor
            bump required Go 1.25.5+. Includes PQ-VLESS (mlkem768x25519plus),
            VLESS Vision UDP443, XHTTP packet-up/stream-up/stream-one.

            **Build flags:** `CGO_ENABLED=0 GOMIPS=softfloat GOTOOLCHAIN=local`,
            Go ${{ inputs.go_version }}, `-ldflags="-s -w -buildid="`,
            `-trimpath`, go.mod patched `go 1.25` → `go 1.24`.

            Source: https://github.com/XTLS/Xray-core/tree/${{ inputs.xray_ref }}

            Consumed by `internal/core/xray.XRayMIPSVersion` in sign-craze.
          files: dist/**
